name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@v2
      - name: Check tag, version, and changelog
        run: python scripts/release_notes.py --check-tag "$GITHUB_REF_NAME"
      - name: Validate manifest and templates
        run: python scripts/validate.py
      - name: Validate React kit
        working-directory: src/frontend/base-ui-react-kit
        run: |
          bun install
          bun run typecheck
          bun run theme:check
      - name: Build template archives
        run: |
          python scripts/build_templates.py
          cd release-assets
          sha256sum -c checksums.sha256
      - name: Write release notes
        run: |
          python scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            link="$repo_url/compare/$previous...$GITHUB_REF_NAME"
          else
            link="$repo_url/commits/$GITHUB_REF_NAME"
          fi
          printf '\n**Full Changelog**: %s\n' "$link" >> "$RUNNER_TEMP/notes.md"
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" --draft --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          for file in release-assets/*.zip release-assets/checksums.sha256; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$file" --clobber; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          done
          gh release edit "$tag" --draft=false --latest
